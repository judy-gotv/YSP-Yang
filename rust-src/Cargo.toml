[package]
name = "iptv-rust"
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
md5 = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wasmtime = { version = "30", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
tempfile = "3"
